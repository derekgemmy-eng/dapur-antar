openapi: 3.0.3
info:
  title: Dapur Antar API
  version: 1.0.0
  description: |
    Demo REST API for the **Dapur Antar** food delivery application (coursework project).

    **Response format** (all endpoints):
    - Success: `{ "status": "success", "data": { ... } }`
    - Error: `{ "status": "error", "message": "...", "details": { ... } }` (`details` is optional)

    **Authentication**: log in via `POST /api/v1/auth/login`, copy `data.token`, then click **Authorize** and paste the token (without the word `Bearer`).

    **Demo notes**
    - Data is stored in memory and resets whenever the server restarts.
    - Payments are simulated (sandbox only); no real money is charged.
    - Tracking is based on order status, not live courier GPS.
    - The webhook and order-status endpoints use the `x-webhook-secret` header (demo default: `demo-webhook-secret`, configurable via the `WEBHOOK_SECRET` environment variable).
  contact:
    name: Dapur Antar
servers:
  - url: http://localhost:3000
    description: Local server
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Menu
  - name: Cart
  - name: Promotions
  - name: Locations
  - name: Orders
  - name: Tracking
  - name: Payments
  - name: Webhook & Admin

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          service: { type: string, example: Dapur Antar API }
                          version: { type: string, example: 1.0.0 }
                          timestamp: { type: string, format: date-time }

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password]
              properties:
                name: { type: string, example: Test User }
                email: { type: string, format: email, example: test1@example.com }
                phone: { type: string, example: '081234567890' }
                password: { type: string, minLength: 8, example: TestPass123 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId: { type: string, example: usr_a1b2c3d4e5 }
        '400':
          description: Missing field, invalid email, or password shorter than 8 characters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                weakPassword:
                  value: { status: error, message: Password must be at least 8 characters }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Email is already registered }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain a bearer token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: test1@example.com }
                password: { type: string, example: TestPass123 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/UserPublic' }
                          token: { type: string, example: 9f2c... (64 hex characters) }
                          tokenType: { type: string, example: Bearer }
                          expiresIn: { type: integer, example: 86400, description: Seconds (informational; the demo server does not enforce expiry) }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Invalid email or password }

  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      operationId: getProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Profile]
      summary: Update profile (partial)
      description: Only the fields sent are changed. Email cannot be changed.
      operationId: updateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Budi Santoso }
                phone: { type: string, example: '081298765432' }
                address: { type: string, example: Jl. Sudirman No. 45, Jakarta }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/menu:
    get:
      tags: [Menu]
      summary: List menu (filter, search, sort)
      operationId: listMenu
      parameters:
        - name: category
          in: query
          description: Category name (case-insensitive). `all` returns everything.
          schema:
            type: string
            enum: [all, Rice, Noodles & Meatballs, Satay & Grill, Snacks, Drinks]
        - name: search
          in: query
          description: Search in name and description
          schema: { type: string, example: ayam }
        - name: sort
          in: query
          schema: { type: string, enum: [price_asc, price_desc] }
      responses:
        '200':
          description: |
            Menu list. Note the nested structure: the items are in `data.data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer, example: 2 }
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/MenuItem' }

  /api/v1/menu/{id}:
    get:
      tags: [Menu]
      summary: Get a single menu item
      operationId: getMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: n1 }
      responses:
        '200':
          description: Menu item details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MenuItem' }
        '404':
          description: Menu item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Menu item not found }

  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get cart
      operationId: getCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      summary: Clear cart
      operationId: clearCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
              example:
                status: success
                data: { items: [], subtotal: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      description: If the item is already in the cart, the quantity is added (maximum total of 20 per item).
      operationId: addCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menuItemId, quantity]
              properties:
                menuItemId: { type: string, example: n1 }
                quantity: { type: integer, minimum: 1, maximum: 20, example: 2 }
                customizations:
                  type: array
                  items: { type: string }
                  example: []
      responses:
        '201':
          description: Item added; returns the updated cart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
        '400':
          description: quantity is not an integer from 1 to 20, or the total exceeds 20
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: quantity must be an integer from 1 to 20 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Menu item not found or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Menu item not found or unavailable }

  /api/v1/cart/items/{menuItemId}:
    patch:
      tags: [Cart]
      summary: Update item quantity (0 = remove)
      operationId: updateCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema: { type: string, example: n1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 20, example: 3 }
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
        '400':
          description: quantity is not an integer from 0 to 20
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Item is not in the cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Cart item not found }

  /api/v1/promotions/apply:
    post:
      tags: [Promotions]
      summary: Validate and calculate a voucher
      description: |
        Available vouchers:

        | Code | Minimum | Effect |
        |---|---|---|
        | `SAVE10` | Rp50,000 | 10% discount, capped at Rp15,000 |
        | `FREESHIP` | Rp40,000 | Free delivery (`deliveryDiscount` = 1) |
        | `NEW20` | Rp60,000 | Rp20,000 off |
      operationId: applyPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promoCode, cartSubtotal]
              properties:
                promoCode: { type: string, example: SAVE10 }
                cartSubtotal: { type: number, example: 56000 }
      responses:
        '200':
          description: Voucher is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid: { type: boolean, example: true }
                          promoCode: { type: string, example: SAVE10 }
                          discountAmount: { type: integer, example: 5600 }
                          deliveryDiscount: { type: integer, description: '1 if free delivery, otherwise 0', example: 0 }
                          minimumSpend: { type: integer, example: 50000 }
                          finalSubtotal: { type: integer, example: 50400 }
        '400':
          description: Invalid code or subtotal below the minimum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidCode:
                  value: { status: error, message: Invalid promotion code }
                belowMinimum:
                  value:
                    status: error
                    message: Cart subtotal does not meet the promotion minimum
                    details: { minimumSpend: 50000 }

  /api/v1/locations:
    get:
      tags: [Locations]
      summary: List delivery areas
      operationId: listLocations
      parameters:
        - name: area
          in: query
          description: Filter by area name (substring match, case-insensitive)
          schema: { type: string, example: kemang }
      responses:
        '200':
          description: Area list. Items are in `data.data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer, example: 8 }
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/Area' }

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create an order from the cart (checkout)
      description: |
        Pricing rules:
        - Delivery is free if the subtotal is at least Rp75,000; otherwise the area's fee applies.
        - Fixed service fee of Rp2,000; tax is 0.
        - Voucher is optional. The cart is emptied after the order is created.
        - Any method other than `CASH` automatically creates a payment with status `PENDING`.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryAddress, area, paymentMethod]
              properties:
                deliveryAddress: { type: string, example: 'Jl. Sudirman No. 45, Jakarta' }
                area: { type: string, example: Menteng, description: Area name from /api/v1/locations }
                paymentMethod: { $ref: '#/components/schemas/PaymentMethodAll' }
                promoCode: { type: string, example: SAVE10 }
                deliveryInstructions: { type: string, example: Call on arrival }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string, example: DA-20261023-A1B2C3 }
                          status: { $ref: '#/components/schemas/OrderStatus' }
                          paymentStatus: { $ref: '#/components/schemas/PaymentStatusOrder' }
                          paymentId: { type: string, nullable: true, example: PAY-1A2B3C4D }
                          estimatedDeliveryMinutes: { type: integer, example: 35 }
                          pricing: { $ref: '#/components/schemas/Pricing' }
        '400':
          description: Missing required field, unsupported method or area, empty cart, or invalid voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                emptyCart:
                  value: { status: error, message: Cart is empty }
                badArea:
                  value: { status: error, message: Delivery area is not supported }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Orders]
      summary: List the user's orders
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order list (newest first). Items are in `data.data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer, example: 1 }
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Get order details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrder' }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /api/v1/orders/{orderId}/tracking:
    get:
      tags: [Tracking]
      summary: Track order status
      description: Status-based. `liveCourierGpsAvailable` is always `false` in the demo version.
      operationId: getTracking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Status and event history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string, example: DA-20261023-A1B2C3 }
                          status: { $ref: '#/components/schemas/OrderStatus' }
                          events:
                            type: array
                            items: { $ref: '#/components/schemas/TrackingEvent' }
                          deliveryAddress: { type: string }
                          liveCourierGpsAvailable: { type: boolean, example: false }
                          message: { type: string, example: Demo tracking only; live courier GPS is not connected. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrder' }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /api/v1/orders/{orderId}/status:
    patch:
      tags: [Webhook & Admin]
      summary: Update order status (demo admin)
      description: Requires the `x-webhook-secret` header. Does not use a bearer token.
      operationId: updateOrderStatus
      security: [{ webhookSecret: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                message: { type: string, example: Kurir menuju lokasi Anda }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string }
                          status: { $ref: '#/components/schemas/OrderStatus' }
                          tracking:
                            type: object
                            properties:
                              status: { $ref: '#/components/schemas/OrderStatus' }
                              events:
                                type: array
                                items: { $ref: '#/components/schemas/TrackingEvent' }
        '400':
          description: Unsupported status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Unsupported order status }
        '401':
          description: Secret is wrong or missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Admin/webhook secret required }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Create a sandbox payment for an order
      description: |
        **Simulation only** - no real transaction takes place. This endpoint does not require a bearer token in the current implementation.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, method]
              properties:
                orderId: { type: string, example: DA-20261023-A1B2C3 }
                method: { $ref: '#/components/schemas/PaymentMethodOnline' }
      responses:
        '201':
          description: Sandbox payment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Payment'
                          - type: object
                            properties:
                              message: { type: string, example: Sandbox placeholder only. No real payment was charged. }
        '400':
          description: Unsupported online payment method
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Unsupported online payment method }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get payment details
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, example: PAY-1A2B3C4D }
      responses:
        '200':
          description: Get payment details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Payment belongs to another user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: You cannot access this payment }
        '404':
          description: Payment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Payment not found }

  /api/v1/webhooks/payment:
    post:
      tags: [Webhook & Admin]
      summary: Payment status webhook (demo)
      description: Requires the `x-webhook-secret` header. Updates the payment status and the order's `paymentStatus`.
      operationId: paymentWebhook
      security: [{ webhookSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, status]
              properties:
                paymentId: { type: string, example: PAY-1A2B3C4D }
                status: { type: string, enum: [PAID, FAILED, CANCELLED], example: PAID }
      responses:
        '200':
          description: Payment status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          paymentId: { type: string }
                          status: { type: string, enum: [PAID, FAILED, CANCELLED] }
                          orderId: { type: string }
        '400':
          description: status is not PAID, FAILED, or CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: 'status must be PAID, FAILED, or CANCELLED' }
        '401':
          description: Secret is wrong or missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Invalid webhook secret }
        '404':
          description: Payment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: error, message: Payment not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from `POST /api/v1/auth/login` (`data.token`). Opaque random token, not a JWT.
    webhookSecret:
      type: apiKey
      in: header
      name: x-webhook-secret
      description: Demo webhook/admin secret (env `WEBHOOK_SECRET`, default `demo-webhook-secret`).

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, example: DA-20261023-A1B2C3 }

  responses:
    Unauthorized:
      description: Token is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: error, message: Missing or invalid bearer token }
    ForbiddenOrder:
      description: Order belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: error, message: You cannot access this order }
    OrderNotFound:
      description: Order not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: error, message: Order not found }

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status: { type: string, example: success }
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    UserPublic:
      type: object
      properties:
        id: { type: string, example: usr_a1b2c3d4e5 }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    Profile:
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          properties:
            address: { type: string, example: '' }
    MenuItem:
      type: object
      properties:
        id: { type: string, example: n1 }
        category: { type: string, example: Rice }
        name: { type: string, example: Nasi Goreng Kampung }
        description: { type: string }
        price: { type: integer, description: Rupiah, example: 28000 }
        stock: { type: integer, example: 50 }
        cookMinutes: { type: integer, example: 10 }
        available: { type: boolean, example: true }
    CartItem:
      type: object
      properties:
        menuItemId: { type: string, example: n1 }
        name: { type: string, example: Nasi Goreng Kampung }
        unitPrice: { type: integer, example: 28000 }
        quantity: { type: integer, example: 2 }
        customizations:
          type: array
          items: { type: string }
        lineTotal: { type: integer, example: 56000 }
    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: integer, example: 56000 }
    Area:
      type: object
      properties:
        id: { type: string, example: a1 }
        name: { type: string, example: Menteng }
        etaMinutes: { type: integer, example: 25 }
        deliveryFee: { type: integer, example: 8000 }
    Pricing:
      type: object
      properties:
        subtotal: { type: integer, example: 56000 }
        discount: { type: integer, example: 5600 }
        tax: { type: integer, example: 0 }
        deliveryFee: { type: integer, example: 8000 }
        serviceFee: { type: integer, example: 2000 }
        totalAmount: { type: integer, example: 60400 }
    OrderStatus:
      type: string
      enum: [CONFIRMED, PREPARING, PICKED_UP, ON_THE_WAY, DELIVERED, CANCELLED]
    PaymentStatusOrder:
      type: string
      enum: [PENDING, PAY_ON_DELIVERY, PAID, FAILED, CANCELLED]
    PaymentMethodAll:
      type: string
      description: Case-insensitive
      enum: [QRIS, GOPAY, OVO, DANA, SHOPEEPAY, CASH]
      example: QRIS
    PaymentMethodOnline:
      type: string
      enum: [QRIS, GOPAY, OVO, DANA, SHOPEEPAY]
      example: QRIS
    TrackingEvent:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        message: { type: string, example: Order received by Dapur Antar }
    Payment:
      type: object
      properties:
        paymentId: { type: string, example: PAY-1A2B3C4D }
        orderId: { type: string, example: DA-20261023-A1B2C3 }
        method: { $ref: '#/components/schemas/PaymentMethodOnline' }
        amount: { type: integer, example: 60400 }
        status: { type: string, enum: [PENDING, PAID, FAILED, CANCELLED], example: PENDING }
        createdAt: { type: string, format: date-time }
        sandbox: { type: boolean, description: Only present on payments created via POST /api/v1/payments, example: true }
    Order:
      type: object
      properties:
        orderId: { type: string, example: DA-20261023-A1B2C3 }
        userId: { type: string }
        email: { type: string, format: email }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        deliveryAddress: { type: string }
        area: { type: string, example: Menteng }
        deliveryInstructions: { type: string }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethodAll' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatusOrder' }
        paymentId: { type: string }
        demoPaymentInstructions: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        estimatedDeliveryMinutes: { type: integer, example: 35 }
        pricing: { $ref: '#/components/schemas/Pricing' }
        tracking:
          type: object
          properties:
            status: { $ref: '#/components/schemas/OrderStatus' }
            events:
              type: array
              items: { $ref: '#/components/schemas/TrackingEvent' }
