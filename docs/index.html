<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dapur Antar API Docs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar-note { background: #7a2e0e; color: #fff; padding: 12px 16px; font: 14px/1.4 system-ui, sans-serif; }
    .topbar-note a { color: #ffd9a8; }
  </style>
</head>
<body>
  <div class="topbar-note">
    Dapur Antar API v1.0.0 &middot; <a href="openapi.yaml">Download openapi.yaml</a> (import into Postman: Import &rarr; this file/link)
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: 'openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        tagsSorter: 'alpha',
        operationsSorter: 'alpha',
        persistAuthorization: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
